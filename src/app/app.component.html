<router-outlet />

@if (nouvelleVersion()) {
  <div class="fixed inset-x-0 bottom-0 z-[60] flex justify-center p-4 pb-[max(1rem,env(safe-area-inset-bottom))] sm:bottom-4 sm:p-0" role="status">
    <div class="flex w-full max-w-md items-center gap-3 rounded-2xl bg-brand-950 px-4 py-3 text-sm text-white shadow-2xl ring-1 ring-white/10">
      <i class="fa-solid fa-circle-arrow-up text-lg text-accent-300"></i>
      <span class="flex-1">Une nouvelle version d’AMI Santé Connect est disponible.</span>
      <button type="button" class="rounded-lg bg-white px-3 py-1.5 text-xs font-semibold text-brand-900 hover:bg-slate-100" (click)="appliquer()">Mettre à jour</button>
    </div>
  </div>
}
